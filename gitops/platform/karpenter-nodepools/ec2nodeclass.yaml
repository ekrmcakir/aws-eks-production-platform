apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default-ec2nodeclass
spec:
  amiFamily: AL2023
  role: "eks-production-platform-karpenter-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-production-platform"
  securityGroupSelectorTerms:
    - tags:
        Name: "eks-production-platform-control-plane-sg"
  tags:
    ManagedBy: "Karpenter"
    Environment: "production"
    Cluster: "eks-production-platform"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
